version: 1
manifest_type: "agent_skill_dependencies"

# ==============================================================================
# Upstream Vendor Skill Dependencies (Manifest-as-Code)
# ==============================================================================
# Managed automatically via: python3 scripts/sync_skills.py
# Decouples physical source synchronization from agent runtime exposure.
# ==============================================================================

vendor_skills:
  - name: "looker-skills"
    source: "https://github.com/looker-open-source/looker-skills.git"
    ref: "main"
    namespace: "looker"
    target: "skills/vendor/looker-skills"
    description: "Official Google Cloud Looker developer & performance engineering skills."
    paths:
      - "skills/looker-performance-optimizer"
      - "skills/connecting-looker-to-bigquery"
      - "skills/lookml-modeling-guidelines"
      - "skills/lookml-liquid"
      - "skills/lookml-access-grants"
      - "skills/lookml-refinements"
      - "skills/lookml-sets"
      - "skills/lookml-tests"
      - "skills/looker-architect"
      - "skills/using-looker-cli"

  - name: "mig-optimize"
    source: "sso://google-cloud-professional-services/mig-optimize"
    ref: "master"
    namespace: "google-cloud-pso"
    target: "skills/vendor/mig-optimize"
    description: "Google Cloud PSO BigQuery Migration & Performance Optimization framework."
    paths:
      - "skills/bq_analyze_job"
      - "skills/bq_optimize_query"
      - "skills/bq_get_job_details"
      - "skills/bq_get_table_info"
      - "skills/bq_execute_sql_readonly"
      - "skills/bq_validate_query"
      - "skills/bq_get_dataset_info"
      - "skills/bq_list_dataset_ids"
      - "skills/bq_list_table_ids"
      - "skills/mig_optimize_discovery"
