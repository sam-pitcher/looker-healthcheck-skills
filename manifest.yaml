version: "1.0.0"
catalog_name: "Looker & BigQuery Healthcheck Skills Suite"
description: "Master multi-agent Skills suite for end-to-end Looker and BigQuery performance auditing, LookML quality scoring, and technical design generation."
author: "Google Cloud PSO / Looker Modernization Team"
license: "Apache-2.0"

orchestrator_skill: "skills/looker-bq-healthcheck/SKILL.md"

skills:
  - id: "looker-bq-healthcheck"
    name: "Looker & BigQuery Healthcheck Master Orchestrator"
    path: "skills/looker-bq-healthcheck"
    entry_point: "skills/looker-bq-healthcheck/SKILL.md"
    role: "Master Healthcheck Orchestrator"
    description: "Autonomous 3-pillar healthcheck engine correlating telemetry across Looker JVM metrics, LookML modeling, and BigQuery slot usage."
    subagents:
      - "looker-performance-auditor"
      - "lookml-quality-auditor"
      - "bq-jobs-diagnostics"

  - id: "lookml-quality-auditor"
    name: "LookML Quality & Transcriber Scoring Auditor"
    path: "skills/lookml-quality-auditor"
    entry_point: "skills/lookml-quality-auditor/SKILL.md"
    role: "Pillar 1: LookML Modeling & Code Quality Specialist"
    description: "Evaluates LookML against the 0-4 Transcriber scoring rubric, auditing primary key integrity, explicit relationships, masked keys, and Gemini readiness."
    scripts:
      - "skills/lookml-quality-auditor/scripts/audit_lookml_rules.py"
      - "skills/lookml-quality-auditor/scripts/stream_lookml.sh"
      - "skills/lookml-quality-auditor/scripts/validate_lookml.sh"

  - id: "looker-performance-auditor"
    name: "Looker Performance & Content Governance Auditor"
    path: "skills/looker-performance-auditor"
    entry_point: "skills/looker-performance-auditor/SKILL.md"
    role: "Pillar 2: Query Lifecycle & Content Specialist"
    description: "Audits query latency decomposition (Looker JVM overhead % vs DB execution vs connection wait), tile bloat, and schedule staggering."
    scripts:
      - "skills/looker-bq-healthcheck/scripts/safe_looker.sh"

  - id: "bq-jobs-diagnostics"
    name: "BigQuery Engine & Warehouse Diagnostics"
    path: "skills/bq-jobs-diagnostics"
    entry_point: "skills/bq-jobs-diagnostics/SKILL.md"
    role: "Pillar 3: BigQuery Warehouse Specialist"
    description: "Audits BigQuery slot contention timelines, query cost outliers, stage spills, table partitioning/clustering, and Aggregate Awareness."
    scripts:
      - "skills/bq-jobs-diagnostics/scripts/run_bq_query.sh"
